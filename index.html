<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURELION ESTATE — Премиальная недвижимость мира</title>
<meta name="description" content="Премиальная недвижимость по всему миру: подбор, ипотека с банком-партнёром, полные гарантии сделки.">
<style>
/* ============================================================
   AURELION — light "gallery" palette, ink + ivory + bronze
   ============================================================ */
:root{
  --bg:#f4f1ea;          /* ivory */
  --bg-soft:#ece7dc;     /* sand   */
  --panel:#fbf9f4;       /* card   */
  --ink:#191510;         /* dark chapter */
  --ink-soft:#241f17;
  --text:#221d15;
  --muted:#7c7361;
  --accent:#9d7b3f;      /* bronze   */
  --accent-bright:#c2a161;
  --line:rgba(25,21,17,.14);
  --serif:"Playfair Display","Georgia",serif;
  --sans:"Manrope","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:16px;line-height:1.6;overflow-x:hidden;
}
::selection{background:rgba(157,123,63,.25)}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg-soft)}
::-webkit-scrollbar-thumb{background:#c3b394;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* ---------- scroll progress ---------- */
#progress{
  position:fixed;top:0;left:0;height:2px;width:0;z-index:600;
  background:linear-gradient(90deg,var(--accent),var(--accent-bright));
  transition:width .12s linear;
}

/* ---------- Preloader ---------- */
#loader{
  position:fixed;inset:0;z-index:1000;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  transition:opacity .8s var(--ease),visibility .8s;
}
#loader.done{opacity:0;visibility:hidden}
#loader .mark{
  font-family:var(--serif);font-size:clamp(28px,4vw,44px);letter-spacing:.42em;
  color:var(--accent);padding-left:.42em;
  opacity:0;animation:fadeUp .9s var(--ease) .1s forwards;
}
#loader .bar{width:180px;height:1px;background:rgba(25,21,17,.15);overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:var(--accent);animation:load 1.6s var(--ease) forwards}
@keyframes load{to{width:100%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.grain{
  position:fixed;inset:-50%;z-index:0;pointer-events:none;opacity:.035;
  background-image:radial-gradient(rgba(25,21,17,.8) .5px,transparent .5px);
  background-size:3px 3px;
  animation:grain 9s steps(6) infinite;
}
@keyframes grain{
  0%,100%{transform:translate(0,0)}16%{transform:translate(-2%,1%)}
  33%{transform:translate(1%,-2%)}50%{transform:translate(-1%,2%)}
  66%{transform:translate(2%,1%)}83%{transform:translate(-2%,-1%)}
}
.glow{
  position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0;
  opacity:.5;will-change:transform;transition:opacity .6s;
}
.glow.g1{width:640px;height:640px;background:radial-gradient(circle,#ecdfc2,transparent 65%);top:-220px;left:-160px}
.glow.g2{width:520px;height:520px;background:radial-gradient(circle,#e3d3ae,transparent 65%);bottom:-200px;right:-140px}

/* ---------- Header ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:20px clamp(20px,5vw,64px);
  border-bottom:1px solid transparent;
  transition:background .5s var(--ease),padding .5s var(--ease),border-color .5s,box-shadow .5s;
}
header.solid{
  background:rgba(244,241,234,.85);backdrop-filter:blur(14px);
  padding:14px clamp(20px,5vw,64px);
  border-bottom-color:var(--line);
  box-shadow:0 8px 30px -18px rgba(25,21,17,.25);
}
.logo{font-family:var(--serif);font-size:22px;letter-spacing:.32em;color:var(--text);white-space:nowrap}
.logo b{color:var(--accent);font-weight:400}
nav{display:flex;gap:clamp(16px,3vw,40px)}
nav a{
  font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  position:relative;padding:4px 0;transition:color .4s;
}
nav a::after{
  content:"";position:absolute;left:0;bottom:0;height:1px;width:0;
  background:var(--accent);transition:width .45s var(--ease);
}
nav a:hover{color:var(--text)}
nav a:hover::after{width:100%}
.header-right{display:flex;align-items:center;gap:16px}
.lang{display:flex;border:1px solid var(--line);background:var(--panel)}
.lang button{
  background:transparent;border:0;color:var(--muted);
  padding:8px 13px;font-size:12px;letter-spacing:.12em;transition:all .35s var(--ease);
}
.lang button.active{background:var(--ink);color:var(--bg)}
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 30px;border:1px solid var(--ink);color:var(--ink);
  font-size:13px;letter-spacing:.18em;text-transform:uppercase;
  background:transparent;position:relative;overflow:hidden;z-index:0;
  transition:color .5s var(--ease);will-change:transform;
}
.btn::before{
  content:"";position:absolute;inset:0;background:var(--ink);
  transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease);z-index:-1;
}
.btn:hover{color:var(--bg)}
.btn:hover::before{transform:scaleX(1)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.solid::before{background:var(--accent);border-color:var(--accent)}
.btn.solid:hover{color:#fbf7ef}
.header-cta{display:none;padding:10px 20px}
@media(min-width:900px){.header-cta{display:inline-flex}}

/* ---------- Hero ---------- */
.hero{
  position:relative;z-index:1;min-height:100vh;
  display:flex;flex-direction:column;justify-content:center;
  padding:140px clamp(20px,5vw,64px) 60px;
}
.hero .kicker{
  display:flex;align-items:center;gap:14px;color:var(--accent);
  font-size:12px;letter-spacing:.34em;text-transform:uppercase;margin-bottom:26px;
}
.hero .kicker::before{content:"";width:56px;height:1px;background:var(--accent)}
.hero h1{
  font-family:var(--serif);font-weight:500;
  font-size:clamp(42px,7.4vw,104px);line-height:1.06;max-width:14ch;color:var(--ink);
}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;margin-right:.25em}
.hero h1 .w span{display:inline-block;transform:translateY(110%);animation:reveal 1s var(--ease) forwards}
.hero h1 em{font-style:italic;color:var(--accent)}
@keyframes reveal{to{transform:none}}
.hero p{margin-top:30px;max-width:52ch;color:var(--muted);font-size:17px}
.hero .actions{margin-top:44px;display:flex;gap:18px;flex-wrap:wrap}
.hero .stats{
  margin-top:70px;
  display:flex;gap:clamp(24px,6vw,90px);flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:26px;
}
.hero .stats b{display:block;font-family:var(--serif);font-size:clamp(26px,3vw,40px);color:var(--accent);font-weight:500}
.hero .stats span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.scroll-hint{
  position:absolute;right:clamp(20px,5vw,64px);bottom:44px;display:none;
  align-items:center;gap:12px;color:var(--muted);font-size:11px;letter-spacing:.3em;text-transform:uppercase;
}
@media(min-width:1000px){.scroll-hint{display:flex}}
.scroll-hint i{width:1px;height:52px;background:linear-gradient(var(--accent),transparent);animation:hint 2s infinite var(--ease);transform-origin:top}
@keyframes hint{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

/* ---------- marquee ---------- */
.marquee{
  position:relative;z-index:1;overflow:hidden;white-space:nowrap;
  border-block:1px solid var(--line);padding:18px 0;background:var(--bg-soft);
}
.marquee .strip{display:inline-flex;animation:marq 42s linear infinite;will-change:transform}
.marquee:hover .strip{animation-play-state:paused}
.marquee span{
  font-family:var(--serif);font-size:15px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--muted);padding-right:4ch;
}
.marquee span b{color:var(--accent);font-weight:400;padding:0 1.4ch 0 0}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- Sections ---------- */
section{position:relative;z-index:1;padding:clamp(80px,11vw,150px) clamp(20px,5vw,64px)}
.sec-head{margin-bottom:clamp(44px,6vw,80px)}
.sec-head .tag{
  display:inline-flex;align-items:center;gap:14px;color:var(--accent);
  font-size:11px;letter-spacing:.34em;text-transform:uppercase;margin-bottom:20px;
}
.sec-head .tag::before{content:"";width:44px;height:1px;background:var(--accent)}
.sec-head h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4.6vw,58px);line-height:1.12;max-width:24ch;color:var(--ink)}
.sec-head p{margin-top:18px;color:var(--muted);max-width:60ch}

.reveal{opacity:0;transform:translateY(46px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.reveal.on{opacity:1;transform:none}
.reveal[data-d="1"]{transition-delay:.12s}
.reveal[data-d="2"]{transition-delay:.24s}
.reveal[data-d="3"]{transition-delay:.36s}
.reveal[data-d="4"]{transition-delay:.48s}

/* ---------- Advantages ---------- */
.adv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1px;background:var(--line)}
.adv{
  background:var(--bg);padding:clamp(30px,3.4vw,52px);position:relative;overflow:hidden;
  transition:background .6s var(--ease);
}
.adv::after{content:"";position:absolute;left:0;top:0;height:2px;width:0;background:var(--accent);transition:width .8s var(--ease)}
.adv:hover{background:var(--panel)}
.adv:hover::after{width:100%}
.adv .num{font-family:var(--serif);font-size:15px;color:var(--accent);letter-spacing:.2em}
.adv h3{font-family:var(--serif);font-size:24px;font-weight:500;margin:20px 0 12px;color:var(--ink)}
.adv p{color:var(--muted);font-size:15px}
.adv .ico{margin-top:26px;opacity:.6;transition:opacity .5s,transform .6s var(--ease)}
.adv:hover .ico{opacity:1;transform:translateX(6px)}
.adv .ico svg{stroke:var(--accent);fill:none;stroke-width:1.3}

/* ---------- Globe (dark chapter) ---------- */
#globe-section{background:var(--ink);color:#e9e4d8;padding-block:clamp(80px,11vw,150px)}
#globe-section .sec-head h2{color:#efe8d8}
#globe-section .sec-head p{color:#9a917c}
.globe-wrap{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,420px);
  gap:clamp(28px,4vw,64px);align-items:center;
}
@media(max-width:900px){.globe-wrap{grid-template-columns:1fr}}
.globe-box{position:relative;aspect-ratio:1.05/1;min-width:0}
#globe{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#globe.grabbing{cursor:grabbing}
.globe-box .hint{
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#8d8470;white-space:nowrap;
}
.loc-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.loc-chip{
  border:1px solid rgba(194,161,99,.35);background:transparent;color:#9a917c;
  padding:9px 16px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;
  transition:all .4s var(--ease);
}
.loc-chip:hover{border-color:var(--accent-bright);color:#e9e4d8}
.loc-chip.active{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.loc-card{
  border:1px solid rgba(194,161,99,.3);background:#201b13;padding:30px 32px;min-height:300px;
  display:flex;flex-direction:column;color:#e9e4d8;
  transition:opacity .35s var(--ease),transform .55s var(--ease);
}
.loc-card.swap{opacity:0;transform:translateY(14px)}
.loc-card .country{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent-bright)}
.loc-card h3{font-family:var(--serif);font-size:30px;font-weight:500;margin:8px 0 4px;color:#f3ecd9}
.loc-card .addr{color:#9a917c;font-size:14px;margin-bottom:16px}
.loc-card .desc{font-size:15px;color:#d9d2bf;flex:1}
.loc-card .price{
  margin-top:20px;padding-top:18px;border-top:1px solid rgba(194,161,99,.28);
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.loc-card .price b{font-family:var(--serif);font-size:26px;color:var(--accent-bright);font-weight:500}
.loc-card .specs{display:flex;gap:18px;color:#9a917c;font-size:13px}
.tour-btn{margin-top:22px;align-self:flex-start;border-color:var(--accent-bright);color:var(--accent-bright)}
.tour-btn::before{background:var(--accent-bright)}
.tour-btn:hover{color:var(--ink)}

/* ---------- Tour modal ---------- */
#tour{
  position:fixed;inset:0;z-index:400;background:rgba(18,14,9,.92);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility .5s;
}
#tour.open{opacity:1;visibility:visible}
.tour-panel{
  width:min(1040px,100%);height:min(680px,90vh);
  background:#17140f;border:1px solid rgba(194,161,99,.35);
  display:flex;flex-direction:column;
  transform:translateY(30px) scale(.98);
  transition:transform .6s var(--ease);
}
#tour.open .tour-panel{transform:none}
.tour-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px 26px;border-bottom:1px solid rgba(194,161,99,.25);
}
.tour-head .title{font-family:var(--serif);font-size:19px;color:#efe8d8}
.tour-head .title small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent-bright);margin-top:2px}
.tour-x{background:none;border:1px solid rgba(194,161,99,.3);color:#9a917c;width:38px;height:38px;flex-shrink:0;transition:all .35s}
.tour-x:hover{color:#efe8d8;border-color:var(--accent-bright)}
.tour-stage{position:relative;flex:1;overflow:hidden;background:#12100b;touch-action:pan-y}
.slide{
  position:absolute;inset:0;overflow:hidden;
  opacity:0;transform:scale(1.06);transition:opacity .9s var(--ease),transform 1.4s var(--ease);
  pointer-events:none;
}
.slide.cur{opacity:1;transform:none;pointer-events:auto}
.slide img{
  width:114%;height:114%;position:absolute;left:-7%;top:-7%;
  object-fit:cover;filter:saturate(.92) contrast(1.02);
  transform:scale(1);transition:transform 18s linear;will-change:transform;
  cursor:grab;
}
.slide.cur img{animation:kenburns 20s var(--ease) alternate infinite}
.slide img.grabbing{cursor:grabbing}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12)}}
.slide .lbl{
  position:absolute;left:26px;bottom:20px;font-size:11px;letter-spacing:.3em;
  text-transform:uppercase;color:rgba(244,241,234,.94);
  background:rgba(13,10,6,.62);padding:8px 14px;backdrop-filter:blur(6px);
}
.slide.plan-slide{background:#12100b}
.slide.plan-slide .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.slide.plan-slide svg{width:100%;height:100%}
.tour-foot{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 26px;border-top:1px solid rgba(194,161,99,.25);
}
.tour-foot .cnt{font-family:var(--serif);color:#9a917c;font-size:15px;letter-spacing:.2em}
.tour-foot .cnt b{color:var(--accent-bright);font-weight:500}
.tour-foot .cur-lbl{font-size:11px;letter-spacing:.24em;color:#9a917c;text-transform:uppercase;text-align:center;flex:1}
.tour-nav{display:flex;gap:10px}
.tour-nav button{
  width:44px;height:44px;background:transparent;border:1px solid rgba(194,161,99,.3);
  color:var(--accent-bright);font-size:17px;transition:all .35s var(--ease);
}
.tour-nav button:hover{background:var(--accent);color:var(--ink);border-color:var(--accent)}

/* ---------- Bank ---------- */
#bank{background:var(--bg-soft)}
.bank-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:clamp(28px,4vw,60px);align-items:start;
}
.bank-note{border-left:2px solid var(--accent);padding-left:26px}
.bank-note h3{font-family:var(--serif);font-size:26px;font-weight:500;margin-bottom:14px;color:var(--ink)}
.bank-note .lead{color:var(--muted);font-size:15px}
.bank-note ul{margin-top:22px;list-style:none}
.bank-note li{
  padding:12px 0;border-bottom:1px solid var(--line);
  display:flex;gap:14px;align-items:baseline;font-size:15px;
}
.bank-note li::before{content:"—";color:var(--accent);flex-shrink:0}
.calc{border:1px solid var(--line);background:var(--panel);padding:clamp(26px,3vw,42px);box-shadow:0 30px 60px -40px rgba(25,21,17,.25)}
.calc h3{font-family:var(--serif);font-size:24px;font-weight:500;margin-bottom:26px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--ink)}
.calc h3 span{font-size:12px;font-family:var(--sans);letter-spacing:.2em;color:var(--accent);text-transform:uppercase;text-align:right}
.calc label{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px}
.calc label output{color:var(--text);font-weight:600;text-align:right}
.calc .ctl{display:flex;gap:14px;align-items:center}
.calc input[type=number]{
  width:118px;flex-shrink:0;padding:9px 12px;background:var(--bg);
  border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:15px;text-align:right;
  border-radius:0;transition:border-color .35s;
}
.calc input[type=number]:focus{outline:none;border-color:var(--accent)}
.calc input[type=number]::-webkit-outer-spin-button,
.calc input[type=number]::-webkit-inner-spin-button{opacity:1}
.calc .ctl input[type=range]{flex:1;min-width:0}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:2px;background:rgba(25,21,17,.2);outline:none}
input[type=range]::-webkit-slider-thumb{
  appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--accent);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--accent);
  cursor:pointer;transition:transform .3s var(--ease);
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25)}
input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:var(--accent);
  border:3px solid var(--panel);box-shadow:0 0 0 1px var(--accent);cursor:pointer;
}
.calc .result{
  margin-top:30px;padding:24px;background:rgba(157,123,63,.08);
  border:1px solid var(--line);text-align:center;
}
.calc .result b{font-family:var(--serif);font-size:clamp(28px,3vw,38px);color:var(--accent);font-weight:500;transition:opacity .3s;display:inline-block}
.calc .result span{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.calc .rate{margin-top:16px;font-size:13px;color:var(--muted);text-align:center}
.calc .rate b{color:var(--text)}
.calc button{width:100%;justify-content:center;margin-top:24px;padding:16px}

/* ---------- Guarantees ---------- */
.guar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px}
.guar{
  border:1px solid var(--line);padding:34px 30px;background:var(--panel);
  position:relative;transition:transform .45s var(--ease),border-color .5s,box-shadow .6s;
  transform-style:preserve-3d;will-change:transform;
}
.guar:hover{border-color:rgba(157,123,63,.55);box-shadow:0 30px 60px -34px rgba(25,21,17,.35)}
.guar .sig{width:46px;height:46px;margin-bottom:22px}
.guar .sig svg{stroke:var(--accent);fill:none;stroke-width:1.2}
.guar h3{font-family:var(--serif);font-size:21px;font-weight:500;margin-bottom:10px;color:var(--ink)}
.guar p{color:var(--muted);font-size:14.5px}
.guar .badge{
  position:absolute;top:22px;right:22px;font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--accent);border:1px solid var(--line);padding:5px 10px;
}

/* ---------- CTA ---------- */
.cta-band{
  text-align:center;border:1px solid var(--line);
  background:linear-gradient(120deg,rgba(157,123,63,.10),rgba(157,123,63,.03));
  padding:clamp(48px,7vw,90px) clamp(24px,5vw,60px);
}
.cta-band h2{font-family:var(--serif);font-weight:500;font-size:clamp(28px,4.4vw,52px);max-width:22ch;margin:0 auto;color:var(--ink)}
.cta-band p{color:var(--muted);margin:18px auto 34px;max-width:54ch}

/* ---------- Footer ---------- */
footer{
  border-top:1px solid var(--line);padding:60px clamp(20px,5vw,64px) 34px;
  position:relative;z-index:1;background:var(--bg);
}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:44px}
@media(max-width:760px){.foot-grid{grid-template-columns:1fr}}
.foot-grid h4{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.foot-grid p{color:var(--muted);font-size:14.5px;padding:5px 0}
.foot-grid .cities{font-size:13.5px}
.foot-bottom{
  margin-top:50px;padding-top:24px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  color:#a49a85;font-size:12.5px;
}

/* ---------- Lead modal ---------- */
#lead{
  position:fixed;inset:0;z-index:500;background:rgba(25,21,17,.6);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility .5s;
}
#lead.open{opacity:1;visibility:visible}
.lead-panel{
  width:min(460px,100%);background:var(--panel);border:1px solid var(--line);padding:38px;
  transform:translateY(26px);transition:transform .6s var(--ease);
  box-shadow:0 40px 90px -40px rgba(25,21,17,.5);
}
#lead.open .lead-panel{transform:none}
.lead-panel h3{font-family:var(--serif);font-size:26px;font-weight:500;margin-bottom:8px;color:var(--ink)}
.lead-panel p{color:var(--muted);font-size:14px;margin-bottom:24px}
.lead-panel input{
  width:100%;padding:14px 16px;margin-bottom:14px;background:var(--bg);
  border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:15px;
  transition:border-color .35s;
}
.lead-panel input:focus{outline:none;border-color:var(--accent)}
.lead-panel form button{width:100%;justify-content:center;margin-top:8px}
#leadClose{width:38px;height:38px;margin-top:0}
.lead-ok{display:none;text-align:center;padding:30px 0}
.lead-ok .lk{font-size:40px;color:var(--accent);font-family:var(--serif)}

@media(max-width:1100px){nav{display:none}}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01s !important;transition-duration:.01s !important}
}
</style>
</head>
<body>

<div id="progress"></div>

<!-- ============ PRELOADER ============ -->
<div id="loader">
  <div class="mark">AURELION</div>
  <div class="bar"><i></i></div>
</div>

<div class="grain"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>

<!-- ============ HEADER ============ -->
<header id="header">
  <a class="logo" href="#top">AURELION<b>&nbsp;ESTATE</b></a>
  <nav>
    <a href="#adv" data-i18n="nav.adv"></a>
    <a href="#globe-section" data-i18n="nav.geo"></a>
    <a href="#bank" data-i18n="nav.bank"></a>
    <a href="#guar" data-i18n="nav.guar"></a>
  </nav>
  <div class="header-right">
    <div class="lang" id="langSwitch">
      <button data-lang="ru" class="active">RU</button>
      <button data-lang="en">EN</button>
    </div>
    <button class="btn header-cta" data-open-lead data-i18n="nav.cta"></button>
  </div>
</header>

<!-- ============ HERO ============ -->
<section class="hero" id="top" style="padding-top:150px">
  <div class="kicker" data-i18n="hero.kicker"></div>
  <h1 id="heroTitle"></h1>
  <p data-i18n="hero.p" id="heroP"></p>
  <div class="actions">
    <button class="btn solid" data-open-lead data-i18n="hero.cta1"></button>
    <a class="btn" href="#globe-section" data-i18n="hero.cta2"></a>
  </div>
  <div class="stats">
    <div><b data-count="1400" data-suffix="+">0</b><span data-i18n="hero.s1"></span></div>
    <div><b data-count="9">0</b><span data-i18n="hero.s2"></span></div>
    <div><b data-count="17">0</b><span data-i18n="hero.s3"></span></div>
  </div>
  <div class="scroll-hint"><span data-i18n="hero.scroll"></span><i></i></div>
</section>

<!-- ============ MARQUEE ============ -->
<div class="marquee" aria-hidden="true"><div class="strip" id="marqueeStrip"></div></div>

<!-- ============ ADVANTAGES ============ -->
<section id="adv">
  <div class="sec-head reveal">
    <div class="tag" data-i18n="adv.tag"></div>
    <h2 data-i18n="adv.h2"></h2>
    <p data-i18n="adv.p"></p>
  </div>
  <div class="adv-grid" id="advGrid"></div>
</section>

<!-- ============ GLOBE ============ -->
<section id="globe-section">
  <div class="sec-head reveal">
    <div class="tag" data-i18n="globe.tag"></div>
    <h2 data-i18n="globe.h2"></h2>
    <p data-i18n="globe.p"></p>
  </div>
  <div class="globe-wrap">
    <div class="globe-box reveal">
      <canvas id="globe"></canvas>
      <div class="hint" data-i18n="globe.hint"></div>
    </div>
    <div class="reveal" data-d="2">
      <div class="loc-list" id="locList"></div>
      <div class="loc-card" id="locCard">
        <div class="country"></div>
        <h3></h3>
        <div class="addr"></div>
        <div class="desc"></div>
        <div class="price"><b></b><span class="specs"></span></div>
        <button class="btn tour-btn" id="openTour"></button>
      </div>
    </div>
  </div>
</section>

<!-- ============ BANK ============ -->
<section id="bank">
  <div class="sec-head reveal">
    <div class="tag" data-i18n="bank.tag"></div>
    <h2 data-i18n="bank.h2"></h2>
  </div>
  <div class="bank-grid">
    <div class="bank-note reveal" data-d="1">
      <h3 data-i18n="bank.noteH"></h3>
      <p class="lead" data-i18n="bank.noteP"></p>
      <ul id="bankList"></ul>
    </div>
    <div class="calc reveal" data-d="2">
      <h3><span data-i18n="bank.calcTitle"></span><span data-i18n="bank.brand" style="font-size:12px"></span></h3>
      <label><span data-i18n="bank.l1"></span> <output id="oPrice">$0</output></label>
      <div class="ctl">
        <input type="number" id="rPriceNum" min="300000" max="12000000" step="50000" value="2500000" inputmode="numeric">
        <input type="range" id="rPrice" min="300000" max="12000000" step="50000" value="2500000" aria-label="price">
      </div>
      <label><span data-i18n="bank.l2"></span> <output id="oDown"></output></label>
      <div class="ctl">
        <input type="number" id="rDownNum" min="10" max="70" step="1" value="30" inputmode="numeric">
        <input type="range" id="rDown" min="10" max="70" step="1" value="30" aria-label="down payment">
      </div>
      <label><span data-i18n="bank.l3"></span> <output id="oTerm"></output></label>
      <div class="ctl">
        <input type="number" id="rTermNum" min="3" max="30" step="1" value="20" inputmode="numeric">
        <input type="range" id="rTerm" min="3" max="30" step="1" value="20" aria-label="term">
      </div>
      <div class="result"><b id="oMonthly">$0</b><span data-i18n="bank.monthly"></span></div>
      <div class="rate" data-i18n="bank.rate"></div>
      <button class="btn solid" data-open-lead data-i18n="bank.apply"></button>
    </div>
  </div>
</section>

<!-- ============ GUARANTEES ============ -->
<section id="guar">
  <div class="sec-head reveal">
    <div class="tag" data-i18n="guar.tag"></div>
    <h2 data-i18n="guar.h2"></h2>
    <p data-i18n="guar.p"></p>
  </div>
  <div class="guar-grid" id="guarGrid"></div>
</section>

<!-- ============ CTA ============ -->
<section>
  <div class="cta-band reveal">
    <h2 data-i18n="cta.h2"></h2>
    <p data-i18n="cta.p"></p>
    <button class="btn solid" data-open-lead data-i18n="cta.btn"></button>
  </div>
</section>

<!-- ============ FOOTER ============ -->
<footer>
  <div class="foot-grid">
    <div>
      <a class="logo" href="#top" style="font-size:20px">AURELION<b>&nbsp;ESTATE</b></a>
      <p style="margin-top:14px" data-i18n="foot.about"></p>
      <p class="cities" data-i18n="foot.cities"></p>
    </div>
    <div>
      <h4 data-i18n="foot.navH"></h4>
      <a href="#adv" data-i18n="nav.adv" style="display:block;padding:5px 0;color:var(--muted);font-size:14.5px"></a>
      <a href="#globe-section" data-i18n="nav.geo" style="display:block;padding:5px 0;color:var(--muted);font-size:14.5px"></a>
      <a href="#bank" data-i18n="nav.bank" style="display:block;padding:5px 0;color:var(--muted);font-size:14.5px"></a>
      <a href="#guar" data-i18n="nav.guar" style="display:block;padding:5px 0;color:var(--muted);font-size:14.5px"></a>
    </div>
    <div>
      <h4 data-i18n="foot.contH"></h4>
      <p>+7 (495) 000-00-00</p>
      <p>hello@aurelion.estate</p>
      <p data-i18n="foot.addr"></p>
    </div>
  </div>
  <div class="foot-bottom">
    <span data-i18n="foot.copy"></span>
    <span data-i18n="foot.partner"></span>
  </div>
</footer>

<!-- ============ TOUR MODAL ============ -->
<div id="tour" aria-hidden="true">
  <div class="tour-panel">
    <div class="tour-head">
      <div class="title"><small data-i18n="tour.small"></small><span id="tourName"></span></div>
      <button class="tour-x" id="tourClose">✕</button>
    </div>
    <div class="tour-stage" id="tourStage"></div>
    <div class="tour-foot">
      <div class="cnt"><b id="tourIdx">01</b> / <span id="tourTotal">04</span></div>
      <div class="cur-lbl" id="tourSlideLbl"></div>
      <div class="tour-nav">
        <button id="tourPrev">←</button>
        <button id="tourNext">→</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ LEAD MODAL ============ -->
<div id="lead" aria-hidden="true">
  <div class="lead-panel">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <h3 data-i18n="lead.h"></h3>
      <button class="tour-x" id="leadClose">✕</button>
    </div>
    <p data-i18n="lead.p"></p>
    <form id="leadForm">
      <input type="text" id="fName" required>
      <input type="tel" id="fTel" required>
      <input type="email" id="fMail" required>
      <button class="btn solid" type="submit" data-i18n="lead.submit"></button>
    </form>
    <div class="lead-ok">
      <div class="lk">✦</div>
      <h3 style="margin-top:12px" data-i18n="lead.okH"></h3>
      <p style="margin-top:8px" data-i18n="lead.okP"></p>
    </div>
  </div>
</div>

/* count-up stats */
const cntIO=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return;
  cntIO.unobserve(e.target);
  const el=e.target, target=+el.dataset.count, suffix=el.dataset.suffix||"";
  const t0=performance.now(), dur=1600;
  (function step(){
    const p=Math.min(1,(performance.now()-t0)/dur);
    const eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*eased).toLocaleString("ru-RU").replace(/\u00A0/g," ")+suffix;
    if(p<1) requestAnimationFrame(step);
  })();
}),{threshold:.5});

/* ============================================================

   ============================================================ */
const canvas=document.getElementById("globe");
const ctx=canvas.getContext("2d");
let W=0,H=0,CX=0,CY=0,R=0,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  const b=canvas.getBoundingClientRect();
  W=b.width;H=b.height;
  canvas.width=W*DPR;canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2;CY=H/2;R=Math.min(W,H)*.40;
}
resize();addEventListener("resize",resize);

let rotY=-0.9,rotX=0.42,visRotY=-0.9,visRotX=0.42;
let autoSpin=true,lastInteract=0,dragging=false;
let px=0,py=0,velY=0,selected=null,hoverIdx=-1;

function project(lat,lon){
  const phi=lat*Math.PI/180,lam=lon*Math.PI/180+visRotY,rx=visRotX;
  const x0=Math.cos(phi)*Math.sin(lam);
  const y0=Math.sin(phi);
  const z0=Math.cos(phi)*Math.cos(lam);
  const y2=y0*Math.cos(rx)-z0*Math.sin(rx);
  const z2=y0*Math.sin(rx)+z0*Math.cos(rx);
  return {x:x0,y:-y2,z:z2};
}

const LAND_FILL="#37301f";
const LAND_EDGE="rgba(196,161,99,.5)";

function drawLand(){
  for(const ring of LAND){
    let run=[];
    const flush=()=>{
      if(run.length>4){
        ctx.beginPath();
        ctx.moveTo(CX+run[0]*R,CY+run[1]*R);
        for(let i=2;i<run.length;i+=2) ctx.lineTo(CX+run[i]*R,CY+run[i+1]*R);
        ctx.closePath();
        ctx.fillStyle=LAND_FILL; ctx.fill();
        ctx.strokeStyle=LAND_EDGE; ctx.lineWidth=1; ctx.stroke();
      }
      run=[];
    };
    for(let i=0;i<ring.length;i+=2){
      const lon=ring[i], lat=ring[i+1];
      if(i>0 && Math.abs(lon-ring[i-2])>90) flush();   /* antimeridian jump */
      if(i===ring.length-2 && Math.abs(lon-ring[0])>90) flush(); /* ring wrap */
      const p=project(lat,lon);
      if(p.z>-0.03) run.push(p.x,p.y);
      else flush();
    }
    /* closing a ring must not draw a chord across the world */
    flush();
  }
}

function drawMarker(m,isActive,isHover){
  const p=project(m.lat,m.lon);
  if(p.z<=0.05) return null;
  const sx=CX+p.x*R,sy=CY+p.y*R;
  const sc=.55+.45*p.z;
  const t=performance.now()/1000;
  if(isActive||isHover){
    const pr=(t*.9+m.lat)%1, pr2=((t*.9+m.lat)%1+.5)%1;
    [[pr,.5],[pr2,.25]].forEach(([ph,al])=>{
      ctx.beginPath(); ctx.arc(sx,sy,(8+ph*24)*sc,0,Math.PI*2);
      ctx.strokeStyle=`rgba(196,161,99,${al*(1-ph)})`; ctx.lineWidth=1; ctx.stroke();
    });
  }
  const g=ctx.createRadialGradient(sx,sy,0,sx,sy,18*sc);
  g.addColorStop(0,isActive?"rgba(226,199,148,.95)":"rgba(196,161,99,.85)");
  g.addColorStop(1,"rgba(196,161,99,0)");
  ctx.beginPath(); ctx.arc(sx,sy,18*sc,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  const rr=(isActive?5:3.4)*sc;
  ctx.beginPath(); ctx.arc(sx,sy,rr,0,Math.PI*2);
  ctx.fillStyle=isActive?"#f3e6c8":(isHover?"#d9bd85":"#c2a161"); ctx.fill();
  ctx.beginPath(); ctx.arc(sx,sy,rr,0,Math.PI*2);
  ctx.strokeStyle="rgba(18,14,9,.8)"; ctx.lineWidth=1.5; ctx.stroke();
  if(isActive||(isHover&&p.z>0.4)){
    ctx.font="600 11px Manrope, sans-serif"; ctx.fillStyle="rgba(244,241,234,.95)";
    ctx.fillText(m.city[lang].toUpperCase(),sx+10,sy+4);
  }
  return {sx,sy};
}

let projected=[];

function draw(){
  requestAnimationFrame(draw);
  const now=performance.now();
  const idle=(now-lastInteract>2600)&&!dragging;

  if(selected&&idle){
    let ty=-selected.lon*Math.PI/180;
    while(ty-visRotY>Math.PI)ty-=Math.PI*2;
    while(ty-visRotY<-Math.PI)ty+=Math.PI*2;
    visRotY+=(ty-visRotY)*.045;
    visRotX+=(0.42-visRotX)*.02;
  } else if(!dragging){
    rotY+=autoSpin?0.0016:velY;
    velY*=.94;
    if(!autoSpin&&Math.abs(velY)<0.0004&&idle)autoSpin=true;
    visRotY+=(rotY-visRotY)*.14;
    visRotX+=(rotX-visRotX)*.12;
  } else {
    visRotY+=(rotY-visRotY)*.4;
    visRotX+=(rotX-visRotX)*.4;
  }

  ctx.clearRect(0,0,W,H);

  const base=ctx.createRadialGradient(CX-R*.35,CY-R*.4,R*.1,CX,CY,R);
  base.addColorStop(0,"#2c2519");base.addColorStop(.65,"#221c12");base.addColorStop(1,"#141009");
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fillStyle=base;ctx.fill();
  ctx.strokeStyle="rgba(196,161,99,.35)";ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(CX,CY,R+2,0,Math.PI*2);
  ctx.strokeStyle="rgba(196,161,99,.14)";ctx.lineWidth=3;ctx.stroke();

  drawLand();

  let started=false;ctx.beginPath();
  for(let lat=-60;lat<=60;lat+=30){
    started=false;
    for(let lon=0;lon<=360;lon+=3){
      const p=project(lat,lon);
      if(p.z>-0.05){const sx=CX+p.x*R,sy=CY+p.y*R;started?ctx.lineTo(sx,sy):(ctx.moveTo(sx,sy),started=true);}
      else started=false;
    }
  }
  for(let lon=0;lon<360;lon+=30){
    started=false;
    for(let lat=-88;lat<=88;lat+=3){
      const p=project(lat,lon);
      if(p.z>-0.05){const sx=CX+p.x*R,sy=CY+p.y*R;started?ctx.lineTo(sx,sy):(ctx.moveTo(sx,sy),started=true);}
      else started=false;
    }
  }
  ctx.strokeStyle="rgba(196,161,99,.10)";ctx.lineWidth=1;ctx.stroke();

  projected=[];
  LOCS.forEach((m,i)=>{
    const pt=drawMarker(m,selected===m,hoverIdx===i);
    projected.push({...pt,idx:i,visible:pt!==null});
  });
  if(selected){
    const p=project(selected.lat,selected.lon);
    if(p.z>0){
      ctx.beginPath(); ctx.arc(CX+p.x*R,CY+p.y*R,10,0,Math.PI*2);
      ctx.strokeStyle="rgba(226,199,148,.9)";ctx.lineWidth=1;ctx.stroke();
    }
  }
}
requestAnimationFrame(draw);

function pos(e){const b=canvas.getBoundingClientRect();const s=e.touches?e.touches[0]:e;return{x:s.clientX-b.left,y:s.clientY-b.top}}
canvas.addEventListener("pointerdown",e=>{
  dragging=true;autoSpin=false;lastInteract=performance.now();
  canvas.classList.add("grabbing");canvas.setPointerCapture(e.pointerId);
  const p=pos(e);px=p.x;py=p.y;velY=0;
});
canvas.addEventListener("pointermove",e=>{
  const p=pos(e);
  if(dragging){
    rotY+=(p.x-px)*0.006;
    rotX=Math.max(-1.1,Math.min(1.1,rotX+(p.y-py)*0.004));
    velY=(p.x-px)*0.0006;px=p.x;py=p.y;lastInteract=performance.now();hoverIdx=-1;
  } else {
    hoverIdx=-1;
    projected.forEach(q=>{if(!q||!q.visible)return; if(Math.hypot(q.sx-p.x,q.sy-p.y)<16)hoverIdx=q.idx;});
    canvas.style.cursor=hoverIdx>=0?"pointer":"grab";
  }
});
addEventListener("pointerup",()=>{dragging=false;canvas.classList.remove("grabbing");lastInteract=performance.now();});
canvas.addEventListener("click",e=>{
  const p=pos(e);let best=-1,bd=18;
  projected.forEach(q=>{if(!q||!q.visible)return;const d=Math.hypot(q.sx-p.x,q.sy-p.y);if(d<bd){bd=d;best=q.idx}});
  if(best>=0){autoSpin=false;lastInteract=performance.now();selectLoc(LOCS[best],true);}
});

function planSVG(loc){
  const R=T().rooms;
  const hall=`<text x="90" y="330" letter-spacing="2" font-size="17" fill="#8d8470">${R.hall.toUpperCase()}</text>`;
  const living=`<text x="320" y="150" letter-spacing="2" font-size="17" fill="#8d8470">${R.living.toUpperCase()}</text>
                <text x="320" y="560" letter-spacing="2" font-size="15" fill="#6a6250">${R.kitchen.toUpperCase()}</text>`;
  const bw=130,bh=150,perRow=loc.beds>3?3:2,shown=Math.min(loc.beds,perRow*2);
  let beds="";
  for(let i=0;i<shown;i++){
    const row=Math.floor(i/perRow),col=i%perRow;
    const x=770+col*bw+(row%2?18:0),y=140+row*170;
    beds+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="none" stroke="#c2a161" stroke-opacity=".75"/>
           <text x="${x+bw/2-24}" y="${y+bh/2}" letter-spacing="2" font-size="14" fill="#8d8470">${R.bed.toUpperCase()} ${i+1}</text>
           <rect x="${x+22}" y="${y+34}" width="86" height="46" fill="none" stroke="#c2a161" stroke-opacity=".45"/>
           <rect x="${x+22}" y="${y+96}" width="52" height="30" fill="none" stroke="#c2a161" stroke-opacity=".3"/>`;
  }
  if(loc.beds>shown) beds+=`<text x="770" y="500" letter-spacing="2" font-size="13" fill="#c2a161">+${loc.beds-shown} ${R.beds.toUpperCase()}</text>`;
  return `<svg viewBox="0 0 1180 620">
    <rect x="40" y="60" width="1100" height="540" fill="none" stroke="#c2a161" stroke-opacity=".9" stroke-width="2"/>
    ${hall}
    <rect x="150" y="60" width="560" height="540" fill="none" stroke="#c2a161" stroke-opacity=".7"/>
    <line x1="150" y1="330" x2="710" y2="330" stroke="#c2a161" stroke-opacity=".5"/>
    ${living}
    <rect x="150" y="380" width="210" height="220" fill="none" stroke="#c2a161" stroke-opacity=".45"/>
    <line x1="360" y1="440" x2="710" y2="440" stroke="#c2a161" stroke-opacity=".35"/>
    <circle cx="205" cy="470" r="16" fill="none" stroke="#c2a161" stroke-opacity=".5"/>
    ${beds}
    <text x="1120" y="590" text-anchor="end" letter-spacing="3" font-size="13" fill="#c2a161">${T().globe.specArea.toUpperCase()} — ${loc.area}</text>
  </svg>`;
}

function slideHTML(label,kind,loc){
  if(kind==="plan"){
    return `<div class="slide plan-slide"><div class="wrap">${planSVG(loc)}</div><span class="lbl">${label}</span></div>`;
  }
  const id=kind.slice(4);
  return `<div class="slide">
    <img src="${PLOCAL[id]||remote(id)}" alt="" loading="lazy" data-pan="1"
         onerror="this.style.display='none'">

}
function buildSlides(){

    if(e.key==="ArrowRight")showSlide(curSlide+1);

  } else if(e.key==="Escape")closeLead();

/* drag-pan: look around inside the frame */
(function(){
  let panning=null;
  stage.addEventListener("pointerdown",e=>{
    const img=e.target.closest("img[data-pan]");
    if(!img||!img.complete||img.naturalWidth===0) return;
    panning={img,imgRect:img.getBoundingClientRect(),x0:e.clientX,y0:e.clientY,tx:0,ty:0};
    img.classList.add("grabbing");
    img.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove",e=>{
    if(!panning) return;
    const dx=e.clientX-panning.x0, dy=e.clientY-panning.y0;
    const w=panning.imgRect.width*0.07, h=panning.imgRect.height*0.07;
    panning.tx=Math.max(-w,Math.min(w,dx));
    panning.ty=Math.max(-h,Math.min(h,dy));
    panning.img.style.transform=`translate(${panning.tx}px,${panning.ty}px)`;
  });
  const drop=()=>{
    if(!panning) return;
    panning.img.classList.remove("grabbing");
    panning.img.style.transform="";
    panning=null;
  };
  stage.addEventListener("pointerup",drop);
  stage.addEventListener("pointercancel",drop);
})();

/* ============================================================
   CALCULATOR
   ============================================================ */
const rPrice=document.getElementById("rPrice"),
      rDown=document.getElementById("rDown"),
      rTerm=document.getElementById("rTerm");
const nPrice=document.getElementById("rPriceNum"),
      nDown=document.getElementById("rDownNum"),
      nTerm=document.getElementById("rTermNum");
const oPrice=document.getElementById("oPrice"),oDown=document.getElementById("oDown"),
      oTerm=document.getElementById("oTerm"),oMonthly=document.getElementById("oMonthly");

const money=n=>"$"+Math.round(n).toLocaleString(lang==="ru"?"ru-RU":"en-US").replace(/,/g," ");
function calc(){
  const price=+rPrice.value,downPct=+rDown.value,years=+rTerm.value;
  const loan=price*(1-downPct/100);
  const rate=0.049/12,n=years*12;
  const m=rate>0?loan*rate*Math.pow(1+rate,n)/(Math.pow(1+rate,n)-1):loan/n;
  oPrice.textContent=money(price);
  oDown.textContent=downPct+"% ("+money(price*downPct/100)+")";
  const word=lang==="ru"
    ?(years%10===1&&years%100!==11?"год":(years%10>=2&&years%10<=4&&(years%100<10||years%100>=20)?"года":"лет"))
    :(years===1?"year":"years");
  oTerm.textContent=years+" "+word;
  oMonthly.style.opacity=0;
  setTimeout(()=>{oMonthly.textContent=money(m)+"/"+(lang==="ru"?"мес":"mo");oMonthly.style.opacity=1;},80);
}
/* two-way sync: range <-> number field, clamped to [min,max] & step grid */
const SLIDERS=[[rPrice,nPrice],[rDown,nDown],[rTerm,nTerm]];
SLIDERS.forEach(([r,n])=>{
  r.addEventListener("input",()=>{n.value=r.value;calc();});
  const applyNum=()=>{
    if(n.value==="")return;
    let v=+n.value;
    if(!isFinite(v))return;
    const min=+r.min,max=+r.max,step=+r.step||1;
    v=Math.round(Math.max(min,Math.min(max,v))/step)*step;
    v=Math.max(min,Math.min(max,v));
    if(String(v)!==n.value)n.value=v;
    if(String(r.value)!==String(v))r.value=v;
    calc();
  };
  n.addEventListener("change",applyNum);
  n.addEventListener("blur",applyNum);
  n.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();applyNum();n.blur();}});
});
